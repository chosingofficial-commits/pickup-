# Optional local/VPS stack: the Pick Up app + a Postgres database.
# For Hostinger Node.js Web App / Cloud hosting, you don't need this file —
# use an external managed Postgres and deploy the app directly (see README).
#
# Usage:
#   cp .env.example .env   # fill in secrets
#   docker compose up --build

services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Overrides whatever is in .env so the app always talks to the
      # `db` service below when running under Compose.
      DATABASE_URL: postgresql://pickup:pickup@db:5432/pickup?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pickup
      POSTGRES_PASSWORD: pickup
      POSTGRES_DB: pickup
    volumes:
      - pickup_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickup -d pickup"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pickup_postgres_data:
